[package]
name = "macos-task-cleaner-cli"
version = "1.0.0"
edition = "2024"
description = "Command-line interface (mtc) for macOS Task Cleaner"
license = "AGPL-3.0-or-later"
repository = "https://github.com/macos-task-cleaner/macos-task-cleaner-cli"

[[bin]]
name = "mtc"
path = "src/main.rs"

[dependencies]
macos-task-cleaner-core = { git = "https://github.com/macos-task-cleaner/macos-task-cleaner-core", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch."https://github.com/macos-task-cleaner/macos-task-cleaner-core"]
macos-task-cleaner-core = { path = "../macos-task-cleaner-core" }

[patch."https://github.com/DonJone/macos-task-cleaner-core"]
macos-task-cleaner-core = { path = "../macos-task-cleaner-core" }
